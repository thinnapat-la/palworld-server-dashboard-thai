# Windows host-native mode
# steamcmd.exe และ PalServer.exe รันบน Windows โดยตรง
# Docker ใช้เฉพาะ Dashboard, Import/Export UI และ workflow control

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  dashboard-host:
    profiles: ["host-admin"]
    image: palworld-dashboard-api:local
    build:
      context: ./dashboard
    container_name: palworld-dashboard-host
    restart: unless-stopped
    init: true
    logging: *default-logging
    cpus: "${DASHBOARD_CPU_LIMIT:-0.25}"
    mem_limit: "${DASHBOARD_MEMORY_LIMIT:-256m}"
    mem_reservation: "${DASHBOARD_MEMORY_RESERVATION:-128m}"
    pids_limit: ${DASHBOARD_PIDS_LIMIT:-128}
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-0.0.0.0}:${DASHBOARD_PORT:-8080}:8080/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: "Asia/Bangkok"
      DASHBOARD_TIMEZONE: "Asia/Bangkok"
      PALWORLD_RUNTIME_MODE: "external"
      PALWORLD_RUNTIME_LABEL: "Windows Host Native"
      PALWORLD_API_URL: "http://${PALWORLD_HOST_API_HOST:-host.docker.internal}:${PALWORLD_HOST_REST_PORT:-8212}/v1/api"
      PALWORLD_ADMIN_PASSWORD: "${PALWORLD_ADMIN_PASSWORD}"
      PALWORLD_DATA_DIR: "/palworld-data"
      PALWORLD_CONFIG_FILE: "/palworld-data/Pal/Saved/Config/WindowsServer/PalWorldSettings.ini"
      PALWORLD_EXTERNAL_CONTROL_DIR: "/host-control"
      PALWORLD_EXTERNAL_CONTROL_TIMEOUT: "${PALWORLD_EXTERNAL_CONTROL_TIMEOUT:-90}"
      DASHBOARD_DATA_DIR: "/data"
      DASHBOARD_USERNAME: "${DASHBOARD_USERNAME:-admin}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:-CHANGE_ME_DASHBOARD_PASSWORD}"
      DASHBOARD_REFRESH_SECONDS: "${DASHBOARD_REFRESH_SECONDS:-30}"
      DASHBOARD_ACTIONS_ENABLED: "${DASHBOARD_ACTIONS_ENABLED:-true}"
      DASHBOARD_DISCORD_WEBHOOK_URL: "${DISCORD_INFORMATION_WEBHOOK_URL:-}"
      DASHBOARD_DISCORD_NOTIFICATIONS_ENABLED: "${DASHBOARD_DISCORD_NOTIFICATIONS_ENABLED:-false}"
      DASHBOARD_MAX_UPLOAD_MB: "${DASHBOARD_MAX_UPLOAD_MB:-4096}"
      DASHBOARD_MAX_EXPANDED_MB: "${DASHBOARD_MAX_EXPANDED_MB:-8192}"
      DASHBOARD_MAX_CONFIG_KB: "${DASHBOARD_MAX_CONFIG_KB:-1024}"
      DASHBOARD_MAX_CONFIG_BACKUPS: "${DASHBOARD_MAX_CONFIG_BACKUPS:-100}"
      PALWORLD_START_TIMEOUT_SECONDS: "${PALWORLD_START_TIMEOUT_SECONDS:-900}"
      PALWORLD_STOP_TIMEOUT_SECONDS: "${PALWORLD_STOP_TIMEOUT_SECONDS:-60}"
    volumes:
      - "${PALWORLD_HOST_DIR:-./host-palworld}:/palworld-data:rw"
      - ./runtime/control:/host-control:rw
      - ./dashboard/data:/data:rw
      - ./dashboard/server.py:/app/server.py:ro
      - ./dashboard/index.html:/app/index.html:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
