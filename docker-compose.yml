  # จำกัดสิทธิ์ Docker API ให้ Dashboard ใช้เฉพาะงานจัดการคอนเทนเนอร์
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: palworld-docker-proxy
    restart: unless-stopped
    environment:
      TZ: "Asia/Bangkok"
      LOG_LEVEL: "warning"
      CONTAINERS: "1"
      POST: "1"
      PING: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default

  dashboard:
    image: palworld-dashboard-api:local
    build:
      context: ./dashboard
    container_name: palworld-dashboard
    restart: unless-stopped
    depends_on:
      palworld:
        condition: service_started
      docker-proxy:
        condition: service_started
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-0.0.0.0}:${DASHBOARD_PORT:-8080}:8080/tcp"
    environment:
      TZ: "Asia/Bangkok"
      DASHBOARD_TIMEZONE: "Asia/Bangkok"
      PALWORLD_API_URL: "http://palworld:8212/v1/api"
      PALWORLD_ADMIN_PASSWORD: "${PALWORLD_ADMIN_PASSWORD}"
      PALWORLD_CONTAINER_NAME: "palworld-server"
      PALWORLD_DATA_DIR: "/palworld-data"
      PALWORLD_PUID: "1000"
      PALWORLD_PGID: "1000"
      DOCKER_API_URL: "http://docker-proxy:2375"
      DASHBOARD_DATA_DIR: "/data"
      DASHBOARD_USERNAME: "${DASHBOARD_USERNAME:-admin}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:-CHANGE_ME_DASHBOARD_PASSWORD}"
      DASHBOARD_REFRESH_SECONDS: "${DASHBOARD_REFRESH_SECONDS:-15}"
      DASHBOARD_ACTIONS_ENABLED: "${DASHBOARD_ACTIONS_ENABLED:-true}"
      DASHBOARD_DISCORD_WEBHOOK_URL: "${DISCORD_INFORMATION_WEBHOOK_URL:-}"
      DASHBOARD_MAX_UPLOAD_MB: "${DASHBOARD_MAX_UPLOAD_MB:-4096}"
      DASHBOARD_MAX_EXPANDED_MB: "${DASHBOARD_MAX_EXPANDED_MB:-8192}"
      PALWORLD_START_TIMEOUT_SECONDS: "${PALWORLD_START_TIMEOUT_SECONDS:-900}"
      PALWORLD_STOP_TIMEOUT_SECONDS: "${PALWORLD_STOP_TIMEOUT_SECONDS:-60}"
    volumes:
      # Dashboard ต้องอ่าน/เขียนข้อมูลเซฟเพื่อสร้าง Export และทำ Import
      - ./palworld:/palworld-data:rw
      # เก็บคิวงาน ประวัติ Ban ไฟล์ Import และไฟล์ Export แบบถาวร
      - ./dashboard/data:/data:rw
      # ผูก source เพื่อแก้ไข Dashboard โดยไม่ต้องกังวล image cache
      - ./dashboard/server.py:/app/server.py:ro
      - ./dashboard/index.html:/app/index.html:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

